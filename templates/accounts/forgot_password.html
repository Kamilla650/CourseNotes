{% extends 'base.html' %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<h1>Забыли пароль?</h1>
<p>Введите email, указанный при регистрации. Мы отправим на него ссылку для смены пароля.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Отправить ссылку</button>
</form>
<p><a href="{% url 'login' %}">Вернуться ко входу</a></p>
{% endblock %}
