{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<form method="post" id="register-form" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <p id="client-errors" class="client-errors" hidden></p>
    <button type="submit">Зарегистрироваться</button>
</form>
<p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>

<script>
document.getElementById('register-form').addEventListener('submit', function (e) {
    const email = this.elements['email'].value.trim();
    const pass1 = this.elements['password1'].value;
    const pass2 = this.elements['password2'].value;
    const errors = [];

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errors.push('Введите корректный email.');
    }
    if (pass1.length < 8) {
        errors.push('Пароль должен содержать не менее 8 символов.');
    }
    if (pass1 !== pass2) {
        errors.push('Пароли не совпадают.');
    }

    const box = document.getElementById('client-errors');
    if (errors.length > 0) {
        e.preventDefault();
        box.textContent = errors.join(' ');
        box.hidden = false;
    } else {
        box.hidden = true;
    }
});
</script>
{% endblock %}
